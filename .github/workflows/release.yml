name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
      NODE_AUTH_TOKEN: ""
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run checktypes

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Detect release changesets
        id: release_changesets
        run: bun scripts/release/has-changesets.ts

      - name: Version packages
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: bun run version

      - name: Commit release version
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .changeset CHANGELOG.md package.json bun.lock
            git commit -m "chore: release package"
          fi

      - name: Read package metadata
        id: package_metadata
        run: bun scripts/release/package-metadata.ts

      - name: Build package
        run: bun run build

      - name: Check npm package
        id: npm_package
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.version }}
        run: bun scripts/release/check-npm-published.ts

      - name: Publish npm
        if: steps.npm_package.outputs.is_published == 'false'
        run: bun run release

      - name: Ensure git tag
        env:
          RELEASE_TAG: ${{ steps.package_metadata.outputs.tag }}
        run: bun scripts/release/ensure-tag.ts

      - name: Prepare release notes
        env:
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.version }}
        run: bun scripts/release/write-release-notes.ts

      - name: Push release commit and tags
        env:
          RELEASE_TAG: ${{ steps.package_metadata.outputs.tag }}
        run: bun scripts/release/push-release-refs.ts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package_metadata.outputs.tag }}
        run: bun scripts/release/create-github-release.ts
